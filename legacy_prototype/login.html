<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Xyverra</title>
    <link rel="stylesheet" href="login.css" />
    <script
      src="https://kit.fontawesome.com/a076d05399.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div class="centered-layout">

      <div class="brand-header">
        <div class="brand-icon">
          <img src="./image/xyverra_logo.jpeg" alt="Xyverra Logo" />
        </div>
        <h1>Xyverra</h1>
        <p>Your AI-powered career roadmap</p>
      </div>

      <div class="card-box auth-card">
        <h2 class="card-title">Welcome to Xyverra</h2>
        <p class="card-subtitle">Sign in to continue your learning journey</p>

        <form action="roadmap.html">
          <div class="form-group">
            <label>Email address</label>
            <div class="input-wrapper">
              <i class="far fa-envelope"></i>
              <input type="email" id="login-email" placeholder="you@example.com" required />
            </div>
          </div>

          <div class="form-group">
            <label>Password</label>
            <div class="input-wrapper">
              <i class="fas fa-lock"></i>
              <input type="password" placeholder="Your password" required />
              <i class="far fa-eye eye-icon"></i>
            </div>
          </div>

          <button
            type="submit"
            class="btn btn-primary"
            style="margin-bottom: 1rem"
          >
            <i class="fas fa-sign-in-alt"></i> Login
          </button>
        </form>

        <a href="#" class="btn btn-outline" style="margin-bottom: 1rem">
          <i class="fas fa-key"></i> Forgot Password
        </a>

        <div class="divider">OR</div>

        <a
          href="signup.html"
          class="btn btn-outline"
          style="margin-bottom: 1.5rem"
        >
          <i class="fas fa-user-plus"></i> Sign Up — Create Free Account
        </a>

        <p
          style="text-align: center; color: var(--text-muted); font-size: 13px"
        >
          Demo: alex@example.com · password123
        </p>
      </div>
    </div>
    <script src="login.js"></script>
  </body>
</html>
