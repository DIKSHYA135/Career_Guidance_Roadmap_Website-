<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Mode - Xyverra</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="global.css">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--bg-body); }
        .study-header { display: flex; align-items: center; justify-content: space-between; padding: 1rem 2rem; background: var(--white); border-bottom: 1px solid var(--border); box-shadow: var(--shadow-sm); z-index: 10; position: relative; }
        .study-header-left { display: flex; align-items: center; gap: 1rem; }
        .back-btn { padding: 0.6rem 1.2rem; background: var(--bg-surface-hover); border: 1px solid var(--border); border-radius: var(--radius-md); color: var(--text-dark); font-weight: 600; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.5rem; text-decoration: none; font-size: 0.9rem; }
        .back-btn:hover { background: rgba(37,99,235,0.05); border-color: var(--primary); color: var(--primary); }
        .course-title { font-size: 1.1rem; font-weight: 700; color: var(--text-dark); margin: 0; }
        .study-header-right { display: flex; gap: 1rem; }
        .btn-fallback { padding: 0.6rem 1.2rem; background: var(--primary); color: white; border: none; border-radius: var(--radius-md); font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 0.5rem; text-decoration: none; font-size: 0.9rem; transition: background 0.2s; }
        .btn-fallback:hover { background: var(--primary-hover); }
        
        .iframe-container { width: 100%; height: calc(100vh - 65px); background: #f3f4f6; position: relative; }
        iframe { width: 100%; height: 100%; border: none; position: relative; z-index: 2; background: white; }
        
        .loading-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: white; z-index: 5; pointer-events: none; transition: opacity 0.3s; }
        .spinner { border: 4px solid rgba(37,99,235,0.1); border-top-color: var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 1rem; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .fallback-message { text-align: center; max-width: 500px; padding: 2rem; background: white; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); border: 1px solid var(--border); z-index: 1; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .fallback-message h3 { margin-top: 0; color: var(--text-dark); font-size: 1.3rem; }
        .fallback-message p { color: var(--text-muted); margin-bottom: 1.5rem; line-height: 1.6; }
        
        @media (max-width: 600px) {
            .study-header { padding: 0.75rem 1rem; flex-direction: column; gap: 0.75rem; align-items: flex-start; }
            .iframe-container { height: calc(100vh - 100px); }
        }
    </style>
</head>
<body>
    <header class="study-header">
        <div class="study-header-left">
            <a href="roadmap.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Roadmap</a>
            <h2 class="course-title" id="display-title">Loading Course...</h2>
        </div>
        <div class="study-header-right">
            <a href="#" id="open-new-tab" target="_blank" class="btn-fallback"><i class="fas fa-external-link-alt"></i> Open in New Tab</a>
        </div>
    </header>
    
    <div class="iframe-container">
        <div class="loading-overlay" id="loader">
            <div class="spinner"></div>
            <p style="color: var(--text-muted); font-weight: 500;">Loading content...</p>
        </div>
        
        <!-- The fallback message sits BEHIND the iframe. If the iframe fails to load (blank), the user will see this through the transparent iframe or we can toggle it. -->
        <div class="fallback-message" id="fallback-msg">
            <i class="fas fa-exclamation-circle" style="font-size: 3rem; color: #F59E0B; margin-bottom: 1rem;"></i>
            <h3>Cannot embed this site</h3>
            <p>This course provider blocks embedding for security reasons. Please open the course in a new tab to continue studying.</p>
            <a href="#" id="fallback-new-tab" target="_blank" class="btn-fallback" style="display: inline-flex;"><i class="fas fa-external-link-alt"></i> Open Course in New Tab</a>
        </div>

        <iframe id="course-frame" sandbox="allow-same-origin allow-scripts allow-popups allow-forms"></iframe>
    </div>

    <script src="study.js"></script>
</body>
</html>
