<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create your free Xyverra account and start your AI-powered career roadmap.">
    <title>Sign Up — Xyverra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="signup.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="centered-layout">

        <!-- Brand Header -->
        <div class="brand-header">
            <div class="brand-icon">
                <img src="xyverra_logo.jpeg" alt="Xyverra Logo" />
            </div>
            <h1>Xyverra</h1>
            <p>Your AI-powered career roadmap</p>
        </div>

        <!-- Sign Up Card -->
        <div class="card-box auth-card">
            <h2 class="card-title">Create your account</h2>
            <p class="card-subtitle">Start your journey to becoming job-ready</p>

            <form id="signup-form" novalidate>
                <div class="form-group">
                    <label for="signup-name">Full name</label>
                    <div class="input-wrapper">
                        <i class="far fa-user"></i>
                        <input type="text" id="signup-name" placeholder="Jane Doe" autocomplete="name" required>
                    </div>
                    <div id="name-error" class="error-message"></div>
                </div>

                <div class="form-group">
                    <label for="signup-email">Email address</label>
                    <div class="input-wrapper">
                        <i class="far fa-envelope"></i>
                        <input type="email" id="signup-email" placeholder="jane@example.com" autocomplete="email"
                            required>
                    </div>
                    <div id="email-error" class="error-message"></div>
                </div>

                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="signup-password" placeholder="Min. 8 characters"
                            autocomplete="new-password" required minlength="6">
                        <i class="far fa-eye eye-icon" id="toggle-password" title="Show password"></i>
                    </div>
                    <div id="password-error" class="error-message"></div>
                    <p class="hint-text">At least 8 characters</p>
                </div>



                <button type="submit" class="btn btn-primary" style="margin-top: 0.5rem;">
                    <i class="fas fa-user-plus"></i> Create Free Account
                </button>
            </form>

            <p class="terms-note">
                By signing up, you agree to our <a href="javascript:void(0)" onclick="alert('Terms page coming soon.')">Terms of Service</a> and <a href="javascript:void(0)" onclick="alert('Privacy Policy coming soon.')">Privacy Policy</a>.
            </p>
        </div>

        <p class="auth-footer">
            Already have an account? <a href="login.html">Sign in</a>
        </p>

    </div>
    <script src="auth-popup.js"></script>
    <script src="signup.js"></script>
</body>

</html>
