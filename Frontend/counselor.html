<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI Career Counselor.">
    <title>AI Career Counselor - Xyverra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="counselor.css">
</head>
<body>

<div class="app-layout">
    <div class="mobile-nav-toggle">
        <div class="sidebar-brand" style="margin-bottom:0;padding:0;">
            <img src="xyverra_logo.jpeg" alt="Xyverra" class="sidebar-logo">
            <span>Xyverra</span>
        </div>
        <button id="sidebar-toggle-btn" class="btn" style="padding:5px;background:transparent;color:var(--primary);">
            <i class="fas fa-bars"></i>
        </button>
    </div>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <aside class="sidebar" id="sidebar-menu">
        <div class="sidebar-brand">
            <img src="xyverra_logo.jpeg" alt="Xyverra" class="sidebar-logo">
            <span>Xyverra</span>
        </div>
        <nav class="nav-menu">
            <a href="dashboard.html" class="nav-item nav-dashboard">
                <i class="fas fa-border-all"></i> Dashboard
            </a>
            <a href="career-discovery.html" class="nav-item nav-career-discovery">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
                Career Discovery
            </a>
            <a href="counselor.html" class="nav-item active nav-counselor">
                <i class="fas fa-robot"></i> AI Counselor
            </a>
            <a href="skill-gap.html" class="nav-item nav-skill-gap">
                <i class="fas fa-chart-line"></i> Skill Gap Analysis
            </a>
            <a href="roadmap.html" class="nav-item nav-roadmap">
                <i class="fas fa-road"></i> My Roadmap
            </a>
            <a href="progress.html" class="nav-item nav-progress">
                <i class="fas fa-chart-bar"></i> Progress Tracker
            </a>
        </nav>
        <div style="flex:1;"></div>
        <div class="user-profile">
            <div class="profile-click-area" title="View Profile">
                <div class="avatar" id="user-avatar"></div>
                <div class="profile-text">
                    <h4 id="user-display-name">Loading...</h4>
                    <p>AI Counselor</p>
                </div>
            </div>
            <button class="signout-btn" title="Sign Out"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </aside>

    <main class="main-content">
        <div class="dashboard-container counselor-container">
            <!-- Hero Banner -->
            <div class="counselor-hero">
                <div class="hero-icon">🤖</div>
                <div>
                    <h1>AI Career Counselor</h1>
                    <p>Ask me anything about careers, skills, and industry trends.</p>
                </div>
            </div>

            <!-- Chat Interface -->
            <div class="chat-card">
                <div class="chat-history" id="chat-history">
                    <div class="chat-message ai-message">
                        <div class="message-avatar"><i class="fas fa-robot"></i></div>
                        <div class="message-content">
                            <p>Hello! I'm your AI Career Counselor. How can I help you shape your future today?</p>
                        </div>
                    </div>
                </div>

                <div class="suggested-prompts" id="suggested-prompts">
                    <button class="prompt-chip">Which career suits me?</button>
                    <button class="prompt-chip">What should I learn?</button>
                    <button class="prompt-chip">What jobs are in demand?</button>
                    <button class="prompt-chip">Is AI Engineering right for me?</button>
                    <button class="prompt-chip">What skills do I need?</button>
                </div>

                <div class="chat-input-area">
                    <input type="text" id="chat-input" placeholder="Type your message here..." autocomplete="off">
                    <button id="send-btn" class="btn btn-primary"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="auth-guard.js"></script>
    <script src="global-sidebar.js"></script>
<script src="counselor.js"></script>
<script src="back-nav.js"></script>
</body>
</html>
