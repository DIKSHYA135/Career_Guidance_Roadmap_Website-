<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Inventory - Xyverra</title>
    <meta name="description"
        content="Manage and track your technical skills across all categories on the Xyverra platform.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="skills.css">
</head>

<body>
    <div class="app-layout">

        <!-- Mobile Header -->
        <div class="mobile-nav-toggle">
            <div class="sidebar-brand" style="margin-bottom:0;padding:0;">
                <img src="./image/xyverra_logo.jpeg" alt="Xyverra" class="sidebar-logo">
                Xyverra
            </div>
            <button id="sidebar-toggle-btn" class="btn" style="padding:5px;background:transparent;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="3" y1="12" x2="21" y2="12" />
                    <line x1="3" y1="6" x2="21" y2="6" />
                    <line x1="3" y1="18" x2="21" y2="18" />
                </svg>
            </button>
        </div>

        <div class="sidebar-overlay" id="sidebar-overlay"></div>

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar-menu">
            <div class="sidebar-brand">
                <img src="./image/xyverra_logo.jpeg" alt="Xyverra" class="sidebar-logo">
                <span>Xyverra</span>
            </div>
            <nav class="nav-menu">
                <a href="dashboard.html" class="nav-item nav-dashboard">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7" />
                        <rect x="14" y="3" width="7" height="7" />
                        <rect x="14" y="14" width="7" height="7" />
                        <rect x="3" y="14" width="7" height="7" />
                    </svg>
                    Dashboard
                </a>
                <a href="skills.html" class="nav-item active nav-skills">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
                    </svg>
                    Skills
                </a>
                <a href="skill-gap.html" class="nav-item nav-skill-gap">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 20V10M18 20V4M6 20v-4" />
                    </svg>
                    Skill Gap Analysis
                </a>
                <a href="skill-input.html" class="nav-item nav-skill-input">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                        <polyline points="14 2 14 8 20 8" />
                        <line x1="16" y1="13" x2="8" y2="13" />
                        <line x1="16" y1="17" x2="8" y2="17" />
                        <polyline points="10 9 9 9 8 9" />
                    </svg>
                    Create Roadmap
                </a>
                <a href="progress.html" class="nav-item nav-progress">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
                    </svg>
                    Progress Tracker
                </a>
            </nav>

            <div style="flex:1;"></div>

            <div class="user-profile">
                <div class="profile-click-area" title="View Profile">
                    <div class="avatar" id="user-avatar"></div>
                    <div class="profile-text">
                        <h4 id="user-display-name">Loading...</h4>
                        <p>Platform Architect</p>
                    </div>
                </div>
                <button class="signout-btn" title="Sign Out">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="dashboard-container">

                <!-- Header -->
                <header class="flex-header">
                    <div class="header-titles">
                        <h1>Skill Inventory</h1>
                        <p>Viewing skills for: <strong id="skills-path-title">Web Development</strong></p>
                    </div>
                    <div class="header-actions">
                        <div class="skill-search-wrap">
                            <i class="fas fa-search skill-search-icon"></i>
                            <input type="text" id="skill-search" class="skill-search-input"
                                placeholder="Search skills…">
                        </div>
                        <button class="btn btn-outline" id="btn-export">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                                <polyline points="7 10 12 15 17 10" />
                                <line x1="12" y1="15" x2="12" y2="3" />
                            </svg>
                            Export
                        </button>
                    </div>
                </header>

                <!-- Analytics Strip -->
                <div class="skills-analytics-strip" id="skills-analytics"></div>

                <!-- Category Cards -->
                <div class="categories-section">
                    <p class="section-title">Explore Categories — click to manage skills</p>
                    <div class="category-cards-container" id="category-cards"></div>
                </div>

                <!-- Skill Panel (shown when a category is selected) -->
                <div class="skill-panel-container" id="skill-panel" style="display:none;">
                    <div class="panel-header">
                        <h3 id="panel-category-title"><i class="fas fa-layer-group"></i> Category</h3>
                        <button class="btn btn-outline btn-close-panel" id="btn-close-panel">
                            <i class="fas fa-times"></i> Close
                        </button>
                    </div>
                    <div class="levels-grid">
                        <!-- Beginner -->
                        <div class="level-column beginner-col">
                            <div class="level-header">
                                <span class="badge-beginner">🌱 Beginner</span>
                                <button class="btn-icon add-skill-btn" data-level="beginner" title="Add Beginner Skill">
                                    <i class="fas fa-plus"></i>
                                </button>
                            </div>
                            <ul class="skill-list" id="list-beginner"></ul>
                        </div>
                        <!-- Intermediate -->
                        <div class="level-column intermediate-col">
                            <div class="level-header">
                                <span class="badge-intermediate">⚡ Intermediate</span>
                                <button class="btn-icon add-skill-btn" data-level="intermediate"
                                    title="Add Intermediate Skill">
                                    <i class="fas fa-plus"></i>
                                </button>
                            </div>
                            <ul class="skill-list" id="list-intermediate"></ul>
                        </div>
                        <!-- Advanced -->
                        <div class="level-column advanced-col">
                            <div class="level-header">
                                <span class="badge-advanced">🚀 Advanced</span>
                                <button class="btn-icon add-skill-btn" data-level="advanced" title="Add Advanced Skill">
                                    <i class="fas fa-plus"></i>
                                </button>
                            </div>
                            <ul class="skill-list" id="list-advanced"></ul>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="toast.js"></script>
    <script src="app-data.js"></script>
    <script src="skills.js"></script>
    <script src="global-sidebar.js"></script>
</body>

</html>
