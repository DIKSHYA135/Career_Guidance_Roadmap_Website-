<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Your personalised career recommendations based on your Xyverra assessment.">
    <title>Career Recommendations - Xyverra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="career-recommendation.css">
</head>
<body>

<div class="app-layout">
    <div class="mobile-nav-toggle">
        <div class="sidebar-brand" style="margin-bottom:0;padding:0;">
            <img src="xyverra_logo.jpeg" alt="Xyverra" class="sidebar-logo">
            <span>Xyverra</span>
        </div>
        <button id="sidebar-toggle-btn" class="btn" style="padding:5px;background:transparent;color:var(--primary);">
            <i class="fas fa-bars"></i>
        </button>
    </div>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <aside class="sidebar" id="sidebar-menu">
        <div class="sidebar-brand">
            <img src="xyverra_logo.jpeg" alt="Xyverra" class="sidebar-logo">
            <span>Xyverra</span>
        </div>
        <nav class="nav-menu">
            <a href="dashboard.html" class="nav-item nav-dashboard"><i class="fas fa-border-all"></i> Dashboard</a>
            <a href="career-discovery.html" class="nav-item active nav-career-discovery">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
                Career Discovery
            </a>
            <a href="skill-gap.html" class="nav-item nav-skill-gap"><i class="fas fa-chart-line"></i> Skill Gap Analysis</a>
            <a href="skill-input.html" class="nav-item nav-skill-input"><i class="fas fa-road"></i> My Roadmap</a>
            <a href="progress.html" class="nav-item nav-progress"><i class="fas fa-chart-bar"></i> Progress Tracker</a>
        </nav>
        <div style="flex:1;"></div>
        <div class="user-profile">
            <div class="profile-click-area" title="View Profile">
                <div class="avatar" id="user-avatar"></div>
                <div class="profile-text">
                    <h4 id="user-display-name">Loading...</h4>
                    <p>Reviewing Matches</p>
                </div>
            </div>
            <button class="signout-btn" title="Sign Out"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </aside>

    <main class="main-content">
        <div class="dashboard-container" style="max-width:1000px;margin:0 auto;">

            <div class="reco-header-row">
                <div>
                    <h1>Your Top Career Matches</h1>
                    <p>Based on your assessment, here are the careers that align best with your profile.</p>
                </div>
                <a href="career-discovery.html" class="btn btn-outline">
                    <i class="fas fa-redo-alt"></i> Retake Assessment
                </a>
            </div>

            <div class="recommendations-container" id="recommendations-list">
                <!-- Cards injected by JS -->
            </div>

            <div class="reco-footer">
                <button class="btn btn-primary" id="compare-btn" style="padding: 12px 28px; font-size: 1rem;">
                    <i class="fas fa-columns"></i> Compare Selected Careers
                </button>
            </div>

        </div>
    </main>
</div>

<script src="global-sidebar.js"></script>
<script src="career-recommendation.js"></script>
</body>
</html>
