<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - Xyverra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="profile.css">
</head>
<body>
    <div class="app-layout">
        <!-- Mobile Header Toggle -->
        <div class="mobile-nav-toggle">
            <div class="sidebar-brand" style="margin-bottom: 0; padding: 0;">
                <img src="./image/xyverra_logo.jpeg" alt="Xyverra Logo" class="sidebar-logo">
                <span>Xyverra</span>
            </div>
            <button id="sidebar-toggle-btn" class="btn" style="padding: 5px; background: transparent; color: var(--primary);">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
        </div>

        <!-- Sidebar Overlay -->
        <div class="sidebar-overlay" id="sidebar-overlay"></div>

        <!-- Sidebar Navigation -->
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar-menu">
            <div class="sidebar-brand">
                <img src="./image/xyverra_logo.jpeg" alt="Xyverra Logo" class="sidebar-logo">
                <span>Xyverra</span>
            </div>
            <nav class="nav-menu">
                <a href="dashboard.html" class="nav-item nav-dashboard">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                    Dashboard
                </a>
                <a href="skills.html" class="nav-item nav-skills">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                    Skills
                </a>
                <a href="skill-gap.html" class="nav-item nav-skill-gap">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V10M18 20V4M6 20v-4"></path></svg>
                    Skill Gap Analysis
                </a>
                <a href="skill-input.html" class="nav-item nav-skill-input">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                    Create Roadmap
                </a>
                <a href="progress.html" class="nav-item nav-progress">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
                    Progress Tracker
                </a>
            </nav>
            
            <div style="flex: 1;"></div>
            
            <div class="user-profile">
                <div class="profile-click-area" title="View Profile">
                    <div class="avatar" id="user-avatar"></div>
                    <div class="profile-text">
                        <h4 id="user-display-name">Loading Candidate...</h4>
                        <p>Platform Architect</p>
                    </div>
                </div>
                <button class="signout-btn" title="Sign Out" style="background:none; border:none; color:var(--text-muted); cursor:pointer;">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="profile-container dashboard-container">
                
                <!-- Profile Header -->
                <div class="profile-header-card content-card">
                    <div class="profile-header-content">
                        <div class="profile-avatar-large" id="profile-avatar">U</div>
                        <div class="profile-info-primary">
                            <h1 id="profile-name">User Name</h1>
                            <p class="profile-email" id="profile-email"><i class="fas fa-envelope"></i> user@example.com</p>
                        </div>
                        <div class="profile-actions">
                            <button class="btn btn-primary" id="edit-profile-btn">
                                <i class="fas fa-edit"></i> Edit Profile
                            </button>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Edit Profile Modal -->
    <div class="modal-overlay" id="edit-profile-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edit Profile</h2>
                <button class="close-modal-btn" id="close-profile-modal"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="edit-name" class="form-control">
                </div>
                <button class="btn btn-primary btn-block" id="save-profile-btn">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- Edit Learning Path Modal -->
    <div class="modal-overlay" id="edit-learning-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Update Learning Path</h2>
                <button class="close-modal-btn" id="close-learning-modal"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Category</label>
                    <select id="edit-category" class="form-control">
                        <option value="Web Development">Web Development</option>
                        <option value="Full Stack Development">Full Stack Development</option>
                        <option value="Backend / APIs">Backend / APIs</option>
                        <option value="Data Science">Data Science</option>
                        <option value="NLP / AI">NLP / AI</option>
                        <option value="Cloud / DevOps">Cloud / DevOps</option>
                        <option value="UI/UX Design">UI/UX Design</option>
                        <option value="Mobile Development">Mobile Development</option>
                        <option value="Cybersecurity">Cybersecurity</option>
                        <option value="Data Analytics">Data Analytics</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Level</label>
                    <select id="edit-level" class="form-control">
                        <option value="Beginner">Beginner</option>
                        <option value="Intermediate">Intermediate</option>
                        <option value="Advanced">Advanced</option>
                    </select>
                </div>
                <button class="btn btn-primary btn-block" id="save-learning-btn">Update & Refresh Skills</button>
            </div>
        </div>
    </div>

    <script src="global-sidebar.js"></script>
    <script src="profile.js"></script>
</body>
</html>
