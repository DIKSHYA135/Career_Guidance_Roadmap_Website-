<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sign in to Xyverra — your AI-powered career roadmap platform." />
    <title>Login — Xyverra</title>
    <link rel="stylesheet" href="login.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  </head>
  <body>
    <div class="centered-layout">

      <!-- Brand Header -->
      <div class="brand-header">
        <div class="brand-icon">
          <img src="./image/xyverra_logo.jpeg" alt="Xyverra Logo" />
        </div>
        <h1>Xyverra</h1>
        <p>Your AI-powered career roadmap</p>
      </div>

      <!-- Login Card -->
      <div class="card-box auth-card">
        <h2 class="card-title">Welcome back</h2>
        <p class="card-subtitle">Sign in to continue your learning journey</p>

        <form id="auth-form" novalidate>
          <div class="form-group">
            <label for="login-email">Email address</label>
            <div class="input-wrapper">
              <i class="far fa-envelope"></i>
              <input
                type="email"
                id="login-email"
                placeholder="you@example.com"
                autocomplete="email"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label for="login-password">Password</label>
            <div class="input-wrapper">
              <i class="fas fa-lock"></i>
              <input
                type="password"
                id="login-password"
                placeholder="Your password"
                autocomplete="current-password"
                required
              />
              <i class="far fa-eye eye-icon" id="toggle-password" title="Show password"></i>
            </div>
          </div>

          <a href="#" class="forgot-link">Forgot password?</a>

          <button type="submit" class="btn btn-primary" id="login-btn">
            <i class="fas fa-sign-in-alt"></i> Sign In
          </button>
        </form>

        <div class="divider">OR</div>

        <a href="signup.html" class="btn btn-outline">
          <i class="fas fa-user-plus"></i> Create a free account
        </a>

        <p class="hint-text">
          Demo: alex@example.com · password123
        </p>
      </div>

      <p class="auth-footer">
        Don't have an account? <a href="signup.html">Sign up for free</a>
      </p>

    </div>
    <script src="login.js"></script>
  </body>
</html>
