<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Roadmap - Xyverra</title>
    <meta name="description" content="Set your skills, level, and preferred modules to generate your personalised Xyverra learning roadmap.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="skill-input.css">
</head>
<body>
    <div class="app-layout">
        <!-- Mobile Header Toggle -->
        <div class="mobile-nav-toggle">
            <div class="sidebar-brand" style="margin-bottom: 0; padding: 0;">
                <img src="./image/xyverra_logo.jpeg" alt="Xyverra Logo" class="sidebar-logo">
                Xyverra
            </div>
            <button id="sidebar-toggle-btn" class="btn" style="padding: 5px; background: transparent;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
        </div>

        <!-- Sidebar Overlay -->
        <div class="sidebar-overlay" id="sidebar-overlay"></div>

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar-menu">
            <div class="sidebar-brand">
                <img src="./image/xyverra_logo.jpeg" alt="Xyverra Logo" class="sidebar-logo">
                Xyverra
            </div>
            <nav class="nav-menu">
                <a href="dashboard.html" class="nav-item nav-dashboard">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                    Dashboard
                </a>
                <a href="skills.html" class="nav-item nav-skills">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                    Skills
                </a>
                <a href="skill-gap.html" class="nav-item nav-skill-gap">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V10M18 20V4M6 20v-4"></path></svg>
                    Skill Gap Analysis
                </a>
                <a href="skill-input.html" class="nav-item active nav-skill-input">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                    Create Roadmap
                </a>
                <a href="progress.html" class="nav-item nav-progress">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
                    Progress Tracker
                </a>
            </nav>

            <div style="flex: 1;"></div>

            <div class="user-profile">
                <div class="profile-click-area" title="View Profile">
                    <div class="avatar" id="user-avatar"></div>
                    <div class="profile-text">
                        <h4 id="user-display-name">Loading...</h4>
                        <p>User Role</p>
                    </div>
                </div>
                <button class="signout-btn" title="Sign Out" style="background:none; border:none; color:var(--text-muted); cursor:pointer;">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="dashboard-container">
                <!-- Page Header -->
                <header class="dashboard-header" style="text-align: center; margin-bottom: 2.5rem;">
                    <h1>Create Your Learning Roadmap</h1>
                    <p>Tell us about your current experience to generate a personalized learning path.</p>
                </header>

                <!-- Form Card -->
                <div class="content-card form-card">
                    <!-- Category Selector -->
                    <div class="form-group">
                        <label>Skill Category</label>
                        <div class="module-select-wrapper">
                            <select id="category-select" class="module-select">
                                <option value="Web Development">Web Development</option>
                                <option value="Full Stack Development">Full Stack Development</option>
                                <option value="Backend / APIs">Backend / APIs</option>
                                <option value="Data Science">Data Science</option>
                                <option value="NLP / AI">NLP / AI</option>
                                <option value="Cloud / DevOps">Cloud / DevOps</option>
                                <option value="UI/UX Design">UI/UX Design</option>
                                <option value="Mobile Development">Mobile Development</option>
                                <option value="Cybersecurity">Cybersecurity</option>
                                <option value="Data Analytics">Data Analytics</option>
                            </select>
                            <i class="fas fa-chevron-down module-select-icon"></i>
                        </div>
                    </div>

                    <!-- Level Selector -->
                    <div class="form-group">
                        <label>Your Current Level</label>
                        <div class="level-selector">
                            <button type="button" class="level-btn active" data-level="Beginner">Beginner</button>
                            <button type="button" class="level-btn" data-level="Intermediate">Intermediate</button>
                            <button type="button" class="level-btn" data-level="Advanced">Advanced</button>
                        </div>
                    </div>

                    <!-- Module Selector (grouped by level) -->
                    <div class="form-group" id="module-selector-group">
                        <label>
                            <i class="fas fa-layer-group" style="margin-right: 6px; color: var(--primary);"></i>
                            Start from Module
                            <span class="field-hint-inline" id="module-level-hint" style="margin-left: 8px; font-size: 0.78rem; color: var(--text-muted); font-weight: 500;">(Beginner modules)</span>
                        </label>
                        <p class="field-hint">Choose the module you want to begin from based on your level</p>
                        <div class="module-select-wrapper">
                            <select id="module-select" class="module-select">
                                <!-- Options injected by JS -->
                            </select>
                            <i class="fas fa-chevron-down module-select-icon"></i>
                        </div>

                        <!-- Module preview card -->
                        <div class="module-preview" id="module-preview" style="display: none;">
                            <div class="module-preview-icon">
                                <i class="fas fa-book-open"></i>
                            </div>
                            <div class="module-preview-text">
                                <span class="module-preview-title" id="module-preview-title"></span>
                                <span class="module-preview-desc" id="module-preview-desc"></span>
                            </div>
                            <span class="module-preview-badge" id="module-preview-badge"></span>
                        </div>
                    </div>

                    <!-- Experience Description -->
                    <div class="form-group">
                        <label for="experience-field">Experience Description <span style="font-weight: 400; color: var(--text-muted);">(Optional)</span></label>
                        <textarea id="experience-field" rows="4" placeholder="Briefly describe what you've built or learned so far..."></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="button" id="generate-btn" class="btn btn-primary generate-btn">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
                            Generate Roadmap
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="app-data.js"></script>
    <script src="roadmap.js"></script>
    <script src="skill-input.js"></script>
    <script src="global-sidebar.js"></script>
</body>
</html>
