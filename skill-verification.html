<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Verification - Xyverra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="dashboard.css">
    <style>
        .verification-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            animation: fadeIn 0.5s ease-out;
        }

        .verification-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .verification-header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--primary-color) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .verification-header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .skill-list {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .skill-item {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .skill-item:hover {
            border-color: var(--primary-color);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.1);
        }

        .skill-info h3 {
            margin: 0 0 0.5rem 0;
            font-size: 1.25rem;
            color: var(--text-primary);
        }

        .skill-info p {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .skill-status {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .status-badge {
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-pending {
            background: rgba(245, 158, 11, 0.1);
            color: #F59E0B;
            border: 1px solid rgba(245, 158, 11, 0.2);
        }

        .status-verified {
            background: rgba(16, 185, 129, 0.1);
            color: #10B981;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .status-failed {
            background: rgba(239, 68, 68, 0.1);
            color: #EF4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .btn-verify {
            padding: 0.6rem 1.5rem;
            border-radius: 8px;
            background: var(--primary-color);
            color: white;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-verify:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-verify.disabled {
            background: var(--bg-secondary);
            color: var(--text-muted);
            cursor: not-allowed;
            pointer-events: none;
        }

        .actions-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-skip {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        .btn-skip:hover {
            color: var(--text-primary);
        }

        .btn-continue {
            padding: 0.8rem 2rem;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--accent-color) 100%);
            color: white;
            border: none;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .btn-continue:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.25);
        }
        
        .no-skills-msg {
            text-align: center;
            padding: 3rem;
            background: rgba(30, 41, 59, 0.5);
            border-radius: 16px;
            color: var(--text-muted);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .skill-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
            .skill-status {
                width: 100%;
                justify-content: space-between;
            }
            .actions-container {
                flex-direction: column;
                gap: 1.5rem;
            }
            .btn-continue {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <!-- Mobile Header Toggle -->
        <div class="mobile-nav-toggle">
            <div class="sidebar-brand" style="margin-bottom: 0; padding: 0;">
                <img src="./image/xyverra_logo.jpeg" alt="Xyverra Logo" class="sidebar-logo">
                Xyverra
            </div>
            <button id="sidebar-toggle-btn" class="btn" style="padding: 5px; background: transparent;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
        </div>

        <!-- Sidebar Overlay -->
        <div class="sidebar-overlay" id="sidebar-overlay"></div>

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar-menu">
            <div class="sidebar-brand">
                <img src="./image/xyverra_logo.jpeg" alt="Xyverra Logo" class="sidebar-logo">
                Xyverra
            </div>
            <nav class="nav-menu">
                <a href="dashboard.html" class="nav-item nav-dashboard">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                    Dashboard
                </a>
                <a href="skills.html" class="nav-item nav-skills">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                    Skills
                </a>
                <a href="skill-gap.html" class="nav-item nav-skill-gap">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V10M18 20V4M6 20v-4"></path></svg>
                    Skill Gap Analysis
                </a>
                <a href="skill-input.html" class="nav-item active nav-skill-input">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                    Create Roadmap
                </a>
                <a href="progress.html" class="nav-item nav-progress">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
                    Progress
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Compact Top-Right Profile -->
            <div class="compact-header-profile">
                <div class="profile-click-area" style="cursor: pointer; display: flex;" title="View Profile">
                    <div class="compact-avatar" id="user-avatar"></div>
                </div>
                <button class="compact-signout signout-btn" title="Sign Out">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
            
            <div class="verification-container">
                <div class="verification-header">
                    <h1>Verify Your Skills</h1>
                    <p>You claimed knowledge in the following areas. Pass a quick quiz to skip them in your roadmap.</p>
                </div>

                <div class="skill-list" id="verification-list">
                    <!-- Populated dynamically -->
                </div>

                <div class="actions-container">
                    <a href="roadmap.html" class="btn-skip" id="btn-skip-all">Skip Verification (Add to Roadmap)</a>
                    <a href="roadmap.html" class="btn-continue" id="btn-continue">Generate Roadmap <i class="fas fa-arrow-right" style="margin-left: 8px;"></i></a>
                </div>
            </div>
        </main>
    </div>

    <!-- Need roadmap.js for ROADMAP_DATA -->
    <script src="roadmap.js"></script>
    <script src="global-sidebar.js"></script>
    <script src="skill-verification.js"></script>
</body>
</html>
