<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Xyverra</title>
    <link rel="stylesheet" href="signup.css">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="centered-layout">
        
        <div class="brand-header">
            <div class="brand-icon">
                <img src="./image/xyverra_logo.jpeg" alt="Xyverra Logo" />
            </div>
            <h1>Xyverra</h1>
            <p>Your AI-powered career roadmap</p>
        </div>

        <div class="card-box auth-card">
            <h2 class="card-title">Create your account</h2>
            <p class="card-subtitle">Start your journey to becoming job-ready</p>
            
            <form action="path-selection.html">
                <div class="form-group">
                    <label>Full name</label>
                    <div class="input-wrapper">
                        <i class="far fa-user"></i>
                        <input type="text" placeholder="Jane Doe" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Email address</label>
                    <div class="input-wrapper">
                        <i class="far fa-envelope"></i>
                        <input type="email" placeholder="jane@example.com" required>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 0.5rem;">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" placeholder="Min. 6 characters" required minlength="6">
                        <i class="far fa-eye eye-icon"></i>
                    </div>
                </div>
                <p class="hint-text" style="margin-bottom: 1.5rem;">At least 6 characters</p>

                <button type="submit" class="btn btn-primary" style="margin-bottom: 1rem;">
                    <i class="fas fa-user-plus"></i> Sign Up
                </button>
            </form>

            <a href="login.html" class="btn btn-text">
                <i class="fas fa-arrow-left"></i> Back to Login
            </a>
        </div>
    </div>
    <script src="signup.js"></script>
</body>
</html>
