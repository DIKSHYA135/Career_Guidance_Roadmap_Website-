<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Inventory - Xyverra</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Main CSS -->
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="skills.css">
</head>
<body>
    <div class="app-layout">
        <!-- Mobile Header Toggle -->
        <div class="mobile-nav-toggle">
            <div class="sidebar-brand" style="margin-bottom: 0; padding: 0;">
                <img src="./image/xyverra_logo.jpeg" alt="Xyverra Logo" class="sidebar-logo">
                Xyverra
            </div>
            <button id="sidebar-toggle-btn" class="btn" style="padding: 5px; background: transparent;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
        </div>

        <!-- Sidebar Overlay -->
        <div class="sidebar-overlay" id="sidebar-overlay"></div>

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar-menu">
            <div class="sidebar-brand">
                <img src="./image/xyverra_logo.jpeg" alt="Xyverra Logo" class="sidebar-logo">
                Xyverra
            </div>
            <nav class="nav-menu">
                <a href="dashboard.html" class="nav-item nav-dashboard">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                    Dashboard
                </a>
                <a href="skills.html" class="nav-item active nav-skills">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                    Skills
                </a>
                <a href="skill-gap.html" class="nav-item nav-skill-gap">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V10M18 20V4M6 20v-4"></path></svg>
                    Skill Gap Analysis
                </a>
                <a href="skill-input.html" class="nav-item nav-skill-input">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                    Create Roadmap
                </a>
                <a href="progress.html" class="nav-item nav-progress">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
                    Progress
                </a>
            </nav>
            
                        <div style="flex: 1;"></div>
            
            <div class="user-profile">
                <div class="profile-click-area" title="View Profile">
                    <div class="avatar" id="user-avatar"></div>
                    <div class="profile-text">
                        <h4 id="user-display-name">Loading...</h4>
                        <p>User Role</p>
                    </div>
                </div>
                <button class="signout-btn" title="Sign Out" style="background:none; border:none; color:var(--text-muted); cursor:pointer;">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="dashboard-container">
                <!-- TOP HEADER SECTION -->
                <header class="page-header flex-header dashboard-header">
                    <div class="header-titles">
                        <h1>Skill Inventory</h1>
                        <p>Required skills for: <strong id="skills-path-title">Web Development</strong></p>
                    </div>
                    <div class="header-actions">
                        <button class="btn btn-outline" id="btn-export">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                            Export
                        </button>
                    </div>
                </header>

                <!-- CATEGORIES SECTION -->
                <div class="categories-section">
                    <h2 class="section-title">Select a Category</h2>
                    <div class="category-cards-container" id="category-cards">
                        <!-- Category cards injected by JS -->
                    </div>
                </div>

                <!-- EXPANDING SKILL PANEL -->
                <div class="skill-panel-container" id="skill-panel" style="display: none;">
                    <div class="panel-header">
                        <h3 id="panel-category-title">Category Skills</h3>
                        <button class="btn btn-outline btn-close-panel" id="btn-close-panel">
                            <i class="fas fa-times"></i> Close
                        </button>
                    </div>
                    <div class="levels-grid">
                        <!-- Beginner -->
                        <div class="level-column beginner-col">
                            <div class="level-header">
                                <span class="badge badge-beginner">Beginner</span>
                                <button class="btn-icon add-skill-btn" data-level="beginner" title="Add Beginner Skill"><i class="fas fa-plus"></i></button>
                            </div>
                            <ul class="skill-list" id="list-beginner"></ul>
                        </div>
                        <!-- Intermediate -->
                        <div class="level-column intermediate-col">
                            <div class="level-header">
                                <span class="badge badge-intermediate">Intermediate</span>
                                <button class="btn-icon add-skill-btn" data-level="intermediate" title="Add Intermediate Skill"><i class="fas fa-plus"></i></button>
                            </div>
                            <ul class="skill-list" id="list-intermediate"></ul>
                        </div>
                        <!-- Advanced -->
                        <div class="level-column advanced-col">
                            <div class="level-header">
                                <span class="badge badge-advanced">Advanced</span>
                                <button class="btn-icon add-skill-btn" data-level="advanced" title="Add Advanced Skill"><i class="fas fa-plus"></i></button>
                            </div>
                            <ul class="skill-list" id="list-advanced"></ul>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="app-data.js"></script>
    <script src="skills.js"></script>
    <script src="global-sidebar.js"></script>
</body>
</html>
