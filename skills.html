<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Inventory Dashboard</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Main CSS -->
    <link rel="stylesheet" href="skills.css">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                Pathfinder
            </div>
            <nav class="nav-menu">
                <a href="dashboard.html" class="nav-item nav-dashboard">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                    Dashboard
                </a>
                <a href="skills.html" class="nav-item active nav-skills">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                    Skills
                </a>
                <a href="skill-gap.html" class="nav-item nav-skill-gap">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V10M18 20V4M6 20v-4"></path></svg>
                    Skill Gap Analysis
                </a>
                <a href="skill-input.html" class="nav-item nav-skill-input">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                    Create Roadmap
                </a>
            </nav>
            
            <div style="flex: 1;"></div>
            <div class="user-profile">
                <div class="profile-info">
                    <div class="avatar" id="user-avatar" style="background:#E0E7FF; color:#4F46E5; width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:600; font-size:14px;">EM</div>
                    <div class="profile-text" style="font-size: 14px;">
                        <h4 id="user-display-name" style="margin:0; color:#1e1e2d;">emmanual macron</h4>
                        <p style="margin:0; font-size:12px; color:#6b7280;">Frontend Developer</p>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="container">
                <!-- Header -->
        <header class="page-header">
            <h1>Skill Inventory</h1>
            <p>Track your proficiencies, discover gaps, and level up your career.</p>
        </header>

        <!-- Tracker Banner & Search -->
        <div class="tracker-banner">
            <div class="tracker-info">
                <div class="icon-circle">
                    <!-- Icon for stats -->
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 20v-6M6 20V10M18 20V4"></path>
                    </svg>
                </div>
                <div>
                    <h2><strong id="total-skills-count">0</strong> Skills Tracked</h2>
                    <p><span id="verified-skills-count">0</span> verified via assessments</p>
                </div>
            </div>
            
            <div class="search-box">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="skill-search" placeholder="Search skills by name...">
            </div>
        </div>

        <!-- Filter Chips -->
        <div class="filter-chips" id="filter-chips">
            <!-- Dynamically populated or statically defined -->
            <button class="chip active" data-filter="All">All Skills</button>
            <button class="chip" data-filter="Web Fundamentals">Web Fundamentals</button>
            <button class="chip" data-filter="Programming">Programming</button>
            <button class="chip" data-filter="Frontend">Frontend</button>
            <button class="chip" data-filter="Backend">Backend</button>
            <button class="chip" data-filter="Tools">Tools</button>
            <button class="chip" data-filter="Data">Data</button>
            <button class="chip gap-chip" data-filter="Gaps">Skill Gaps</button>
        </div>

        <!-- Skill Cards Grid -->
        <div id="skills-container" class="skills-grid">
            <!-- Cards will be dynamically injected here -->
        </div>
        </div>
        </main>
    </div>

    <!-- Main JS -->
    <script src="skills.js"></script>

    <!-- Navigation Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Restore user session if stored
            const userName = localStorage.getItem('userName');
            if (userName) {
                const sidebarUserName = document.getElementById('user-display-name');
                const sidebarAvatar = document.getElementById('user-avatar');
                
                if (sidebarUserName) sidebarUserName.textContent = userName;
                if (sidebarAvatar) {
                    const initials = userName.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
                    sidebarAvatar.textContent = initials;
                }
            }

            // Click Navigation for Sidebar items
            const navDashboardLinks = document.querySelectorAll('.nav-dashboard');
            
            navDashboardLinks.forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    
                    // Add smooth transition effect before navigating
                    document.body.style.opacity = '0';
                    document.body.style.transition = 'opacity 0.3s ease';
                    
                    setTimeout(() => {
                        window.location.href = "dashboard.html";
                    }, 300);
                });
            });

            // Set Sidebar Active State Dynamically based on current URL
            const currentPath = window.location.pathname;
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
                if (item.getAttribute('href') && currentPath.includes(item.getAttribute('href'))) {
                    item.classList.add('active');
                } else if (currentPath.endsWith('/') && item.getAttribute('href') === 'dashboard.html') {
                    item.classList.add('active');
                }
            });

            // Fix broken links by preventing default on empty hrefs or #
            document.querySelectorAll('a[href="#"], a[href=""]').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    console.log('Broken link clicked and prevented.');
                });
            });
        });
    </script>
</body>
</html>
